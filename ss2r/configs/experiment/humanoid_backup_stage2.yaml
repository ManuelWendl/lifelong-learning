# @package _global_
# Stage 2: Train a backup (upright-recovery) policy with SPIDR pessimism.
#
# Two Q-functions are learned simultaneously:
#   Q_r (reward):  dense shaping reward = (head_h/thresh) * (torso_u/thresh)
#                  → drives the actor to stand up via continuous gradient signal.
#   Q_c (cost):    sparse indicator reward = 1 iff in set A, discounting=1
#                  → converges to P(reach A within H steps), the theoretically
#                     grounded backup value function used in Stage 3.
#
# safety_budget=0.0 so the constraint never blocks the actor during Stage 2.
# SPIDR wraps the environment with domain randomization and subtracts a pessimism
# penalty (lambda_ * std over perturbed models) from both Q-targets.
#
# Run:  python train_brax.py +experiment=humanoid_backup_stage2
defaults:
  - mujoco_playground_dm_control
  - override /environment: humanoid_backup
  - override /agent/propagation: spidr
  - _self_

backup:
  # W&B run ID from Stage 1. 
  states_wandb_run_id: zfsniq3a

environment:
  task_params:
    simulator_states_path: ""
    ground_start_probability: 0.9  # 0.0 = always standing, 1.0 = always from buffer
    dense_reward_scale: 1.0
  train_params:
    friction: [-0.05, 0.05]
    gear_hip:
      x: [-20., 20.]
      y: [-20., 20.]
      z: [-60., 60.]
    gear_knee: [-1., 1.]

training:
  num_timesteps: 5000000
  safe: true
  safety_budget: 0.0  # no constraint on the actor — Q_c is learned purely for Stage 3
  train_domain_randomization: true
  eval_domain_randomization: false
  store_checkpoint: true
  episode_length: 200
  wandb_id: ""  # don't load policy from Stage 1 — initialize fresh

agent:
  activation: swish
  discounting: 0.99
  safety_discounting: 1.0  # Q_c with gamma=1 converges to P(reach A within H steps)
  propagation:
    lambda_: 0.1
