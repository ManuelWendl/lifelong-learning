# @package _global_
# Stage 2: Train a backup (upright-recovery) policy with SPIDR pessimism.
#
# The environment initialises from the states saved by Stage 1.
# Reward is sparse: 0 at every step, 1 on entering set A (upright) + termination.
# With discounting=1.0, the optimal Q-function equals P(reach A within H steps).
# SPIDR wraps the environment with domain randomization and subtracts a pessimism
# penalty (lambda_ * std over perturbed models) from the Q-target, so the learned
# Q* is a lower bound on recovery probability across the randomization distribution.
#
# Run:  python train_brax.py +experiment=humanoid_backup_stage2
defaults:
  - mujoco_playground_dm_control
  - override /environment: humanoid_backup
  - override /agent/propagation: spidr
  - _self_

backup:
  # W&B run ID from Stage 1. 
  states_wandb_run_id: zfsniq3a

environment:
  task_params:
    simulator_states_path: ""
    ground_start_probability: 0.5  # 0.0 = always standing, 1.0 = always from buffer
  train_params:
    friction: [-0.05, 0.05]
    gear_hip:
      x: [-20., 20.]
      y: [-20., 20.]
      z: [-60., 60.]
    gear_knee: [-40., 40.]

training:
  num_timesteps: 5000000
  safe: false
  train_domain_randomization: true
  eval_domain_randomization: false
  store_checkpoint: true
  episode_length: 200
  wandb_id: ""  # don't load policy from Stage 1 — initialize fresh

agent:
  activation: swish
  discounting: 1.0
  # Disable entropy regularisation: the loaded walk policy outputs concentrated
  # distributions for OOD fallen-state observations, causing log_prob >> 0.
  # alpha_loss = alpha*(-log_prob - target_entropy) < 0 → alpha grows without
  # bound → next_v -= alpha*log_prob explodes with gamma=1.0.
  init_alpha: 1.0
  propagation:
    lambda_: .1.
