# @package _global_
# Stage 1: Train a humanoid walk policy for 2M steps.
# During training, an EpochStateCollector hook captures (qpos, qvel) pairs from
# every epoch, giving a diverse distribution (early stumbling through upright walking).
# After training, states are uploaded to W&B as a simulator_states artifact.
#
# Run:  python train_brax.py +experiment=humanoid_backup_stage1
defaults:
  - mujoco_playground_dm_control
  - override /environment: humanoid_walk
  - _self_

training:
  num_timesteps: 2000000
  safe: false
  train_domain_randomization: false
  eval_domain_randomization: false
  store_checkpoint: true
  num_evals: 20

agent:
  activation: swish
  discounting: 0.99
  init_alpha: 1.0

backup:
  n_states: 1000000
